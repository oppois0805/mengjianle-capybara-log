<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>猛健樂體重編輯概念 v3</title>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    :root{--ink:#24231f;--muted:#716e66;--line:#ded8d0;--paper:#fffdfa;--blue:#edf6fb;--teal:#4c918f;--teal-soft:#e6f2f0;--coral:#f46d5a;--pink:#f7e8ee;--shadow:0 22px 56px rgba(60,52,45,.16)}
    *{box-sizing:border-box} body{width:1500px;height:980px;margin:0;overflow:hidden;color:var(--ink);background:linear-gradient(90deg,#fff9fb 0 50%,#eef7fb 50% 100%);font-family:"Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif} button,input,textarea{font:inherit}.board-title{position:absolute;top:28px;left:46px;display:flex;align-items:baseline;gap:16px}.board-title h1{margin:0;font-size:28px}.board-title span{color:var(--teal);font-size:14px;font-weight:800}.phone{position:absolute;top:88px;width:390px;height:850px;overflow:hidden;border:10px solid #252524;border-radius:44px;background:#fffafc;box-shadow:var(--shadow)}.phone.record{left:46px}.phone.edit{left:466px}.screen{height:100%;background:#fffafc}.app-head{display:grid;min-height:72px;grid-template-columns:40px 1fr 40px;align-items:center;padding:10px 16px;border-bottom:1px solid #e5dedb;background:rgba(255,255,255,.8)}.app-head h2{margin:0;text-align:center;font-size:21px}.back{display:grid;width:38px;height:38px;place-items:center;border:0;background:transparent;color:var(--ink)}.back svg{width:21px}.main{padding:16px 18px 26px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:4px;border-radius:8px;background:var(--pink)}.tab{min-height:42px;border:0;border-radius:6px;color:#68645d;background:transparent;font-size:13px;font-weight:800}.tab.active{color:var(--ink);background:#fff;box-shadow:0 1px 3px rgba(40,40,30,.12)}.section-title{margin:26px 0 16px;font-size:18px}.field{display:block;margin-bottom:15px}.field>span{display:block;margin-bottom:7px;font-size:12px;font-weight:900}.input{display:flex;height:52px;align-items:center;justify-content:space-between;padding:0 13px;border:1px solid #bdced0;border-radius:7px;background:#fff}.input strong{font-size:16px}.input svg{width:21px;color:#6b6963}.input.weight strong{font-size:24px}.input.weight small{color:var(--muted);font-size:14px;font-weight:900}.delta{display:flex;align-items:center;justify-content:space-between;margin:-3px 0 15px;padding:10px 12px;border-radius:7px;background:var(--teal-soft);color:#3d716f;font-size:12px}.textarea{height:78px;align-items:flex-start;padding-top:12px;color:#4f4d47}.save{display:flex;width:100%;height:52px;align-items:center;justify-content:center;gap:8px;border:0;border-radius:7px;color:#fff;background:var(--coral);font-size:16px;font-weight:900}.save svg{width:19px}.record .screen:before{content:none}.edit .screen{background:var(--blue)}.edit .main{padding-top:18px}.edit-card{padding:18px;border:1px solid var(--line);border-radius:8px;background:#fff}.edit-banner{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding:13px;border-radius:7px;background:var(--teal-soft)}.edit-banner svg{width:22px;color:var(--teal)}.edit-banner strong{display:block;font-size:14px}.edit-banner small{color:var(--muted)}.actions{display:grid;grid-template-columns:1fr 1.5fr;gap:10px}.cancel{height:50px;border:1px solid #c9cecc;border-radius:7px;background:#fff;font-weight:800}.desktop{position:absolute;top:88px;right:40px;width:570px;height:850px;overflow:hidden;border:1px solid #cad4d2;border-radius:10px;background:var(--blue);box-shadow:var(--shadow)}.desktop-head{display:flex;height:76px;align-items:center;gap:10px;padding:0 26px;border-bottom:1px solid #d8e1e1;background:#fff}.desktop-head img{width:38px;height:38px;object-fit:contain}.desktop-head strong{font-size:18px}.history{padding:26px}.history h2{margin:0 0 18px}.history-tabs{display:grid;width:285px;grid-template-columns:repeat(3,1fr);gap:3px;margin-bottom:16px;padding:4px;border-radius:8px;background:#dcecf4}.weight-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;margin-bottom:10px;padding:15px;border:1px solid var(--line);border-radius:8px;background:#fff}.weight-row b{font-size:18px}.weight-row small{display:block;margin-top:4px;color:var(--muted)}.edit-btn{display:grid;width:40px;height:40px;place-items:center;border:1px solid #c8d9da;border-radius:7px;color:var(--teal);background:#fff}.edit-btn svg{width:19px}.dialog{position:absolute;right:20px;bottom:24px;width:360px;padding:20px;border:1px solid #c9d3d1;border-radius:8px;background:#fff;box-shadow:0 20px 48px rgba(45,50,48,.2)}.dialog-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.dialog-head h3{margin:0;font-size:18px}.close{display:grid;width:34px;height:34px;place-items:center;border:0;background:transparent}.dialog .field{margin-bottom:12px}.dialog .input{height:46px}.dialog .actions{margin-top:14px}.note{position:absolute;right:44px;bottom:15px;color:var(--muted);font-size:12px}
  </style>
</head>
<body>
  <div class="board-title"><h1>體重紀錄與編輯</h1><span>無頂端灰色把手</span></div>
  <section class="phone record"><div class="screen"><header class="app-head"><button class="back"><i data-lucide="chevron-left"></i></button><h2>記錄體重</h2><span></span></header><main class="main"><div class="tabs"><button class="tab">施打紀錄</button><button class="tab">購買紀錄</button><button class="tab active">體重紀錄</button></div><h3 class="section-title">記錄體重</h3><label class="field"><span>測量日期</span><div class="input"><strong>2026/08/22</strong><i data-lucide="calendar"></i></div></label><label class="field"><span>測量時間</span><div class="input"><strong>07:35</strong><i data-lucide="clock-3"></i></div></label><label class="field"><span>體重</span><div class="input weight"><strong>76.8</strong><small>kg</small></div></label><div class="delta"><span>上次紀錄 77.5 kg</span><strong>下降 0.7 kg</strong></div><label class="field"><span>備註（選填）</span><div class="input textarea">早晨空腹</div></label><button class="save"><i data-lucide="check"></i>確認儲存</button></main></div></section>
  <section class="phone edit"><div class="screen"><header class="app-head"><button class="back"><i data-lucide="chevron-left"></i></button><h2>編輯體重</h2><span></span></header><main class="main"><div class="edit-card"><div class="edit-banner"><i data-lucide="pencil"></i><div><strong>編輯 8月22日紀錄</strong><small>儲存後同步更新首頁與趨勢圖</small></div></div><label class="field"><span>測量日期</span><div class="input"><strong>2026/08/22</strong><i data-lucide="calendar"></i></div></label><label class="field"><span>測量時間</span><div class="input"><strong>07:35</strong><i data-lucide="clock-3"></i></div></label><label class="field"><span>體重</span><div class="input weight"><strong>76.8</strong><small>kg</small></div></label><label class="field"><span>備註（選填）</span><div class="input textarea">早晨空腹</div></label><div class="actions"><button class="cancel">取消</button><button class="save"><i data-lucide="save"></i>儲存修改</button></div></div></main></div></section>
  <section class="desktop"><header class="desktop-head"><img src="../../public/capybara-wenwen.png"><strong>文文的紀錄</strong></header><main class="history"><h2>歷史紀錄</h2><div class="history-tabs"><button class="tab">施打</button><button class="tab">購買</button><button class="tab active">體重</button></div><article class="weight-row"><div><b>76.8 kg</b><small>2026-08-22　07:35　早晨空腹</small></div><button class="edit-btn"><i data-lucide="pencil"></i></button></article><article class="weight-row"><div><b>77.5 kg</b><small>2026-08-15　07:42　早晨空腹</small></div><button class="edit-btn"><i data-lucide="pencil"></i></button></article><article class="weight-row"><div><b>77.9 kg</b><small>2026-08-08　07:28　開始記錄</small></div><button class="edit-btn"><i data-lucide="pencil"></i></button></article></main><section class="dialog"><div class="dialog-head"><h3>編輯體重紀錄</h3><button class="close"><i data-lucide="x"></i></button></div><label class="field"><span>日期與時間</span><div class="input"><strong>2026/08/22　07:35</strong><i data-lucide="calendar-clock"></i></div></label><label class="field"><span>體重</span><div class="input weight"><strong>76.8</strong><small>kg</small></div></label><label class="field"><span>備註</span><div class="input">早晨空腹</div></label><div class="actions"><button class="cancel">取消</button><button class="save"><i data-lucide="save"></i>儲存修改</button></div></section></section>
  <div class="note">手機採整頁編輯；桌面採對話框，欄位與操作一致</div>
  <script>lucide.createIcons();</script>
</body>
</html>
